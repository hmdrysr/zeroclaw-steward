# Tests, rebuilds and releases ZeroClaw + Steward automatically.
#
# To turn on: create .github/workflows/tests.yml in GitHub's web editor and
# paste this file in. (GitHub doesn't let a workflow add workflow files.)
#
# Every push to main, once the tests pass:
#   1. copies version, author and links from steward/pyproject.toml into
#      CITATION.cff, the README and the package (tools/metadata.py)
#   2. rebuilds dist/steward-setup.sh if anything it contains changed
#   3. when the version in pyproject.toml is new, publishes a GitHub release
#      with the installer, its SHA-256 and that version's CHANGELOG notes
#   4. updates the repository's "About" box (description, website, topics),
#      if the optional ABOUT_TOKEN secret is set (see CONTRIBUTING.md)
# Pull requests only run the tests.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Fedora, privileged so bubblewrap can create its sandboxes.
    container:
      image: fedora:43
      options: --privileged
    steps:
      - name: System packages
        run: dnf -y -q install git python3 python3-pip bubblewrap tar gzip findutils procps-ng util-linux diffutils
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in setup.sh uninstall-all.sh steward/install.sh steward/uninstall.sh tools/build-installer.sh dist/steward-setup.sh; do bash -n "$f"; done
      - name: Project details readable
        run: python3 tools/metadata.py about && python3 tools/metadata.py notes > /dev/null
      - name: Steward tests
        run: |
          cd steward
          python3 -m venv .venv
          .venv/bin/pip install -q '.[test]'
          .venv/bin/python -m pytest -q -p no:cacheprovider tests

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync project details and rebuild installer
        run: |
          set -euo pipefail
          python3 tools/metadata.py sync
          bash tools/build-installer.sh
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Update project details and installer"
            git push
            echo "Committed updated files."
          else
            echo "Everything already up to date."
          fi
      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(python3 tools/metadata.py about | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released. To release, raise the version in steward/pyproject.toml and add its CHANGELOG section."
            exit 0
          fi
          python3 tools/metadata.py notes > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "### Install"
            echo
            echo '```'
            echo "curl -fsSLo /tmp/steward-setup.sh https://github.com/$GITHUB_REPOSITORY/releases/latest/download/steward-setup.sh && bash /tmp/steward-setup.sh"
            echo '```'
            echo
            echo "SHA-256 of steward-setup.sh: \`$(cut -d' ' -f1 dist/steward-setup.sh.sha256)\`"
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "v$v" dist/steward-setup.sh dist/steward-setup.sh.sha256 \
            --title "ZeroClaw + Steward $v" --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$(git rev-parse HEAD)" --latest
          echo "Released v$v."
      - name: Update the repository's About box
        env:
          ABOUT_TOKEN: ${{ secrets.ABOUT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ABOUT_TOKEN:-}" ]; then
            echo "::notice::ABOUT_TOKEN is not set, so the About box wasn't updated. See CONTRIBUTING.md."
            exit 0
          fi
          about="$(python3 tools/metadata.py about)"
          desc="$(echo "$about" | python3 -c 'import json,sys;print(json.load(sys.stdin)["description"])')"
          home="$(echo "$about" | python3 -c 'import json,sys;print(json.load(sys.stdin)["homepage"])')"
          topics="$(echo "$about" | python3 -c 'import json,sys;print(",".join(json.load(sys.stdin)["topics"]))')"
          GH_TOKEN="$ABOUT_TOKEN" gh repo edit "$GITHUB_REPOSITORY" --description "$desc" --homepage "$home" --add-topic "$topics"
          echo "About box updated."
